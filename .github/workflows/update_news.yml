name: Hourly News Update

on:
  schedule:
    # Runs at minute 0 of every hour (e.g., 13:00, 14:00)
    - cron: '0 * * * *'
  # Allows you to run it manually from the Actions tab for testing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Update Script
      env:
        # We inject the secret key here so the script can access it
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python update_news.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "NewsBot"
        git config --global user.email "bot@ahora.nl"
        git add data/news.json
        # Only commit if the file actually changed
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 AI Update: New Articles Added" && git push)