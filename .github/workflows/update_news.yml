name: Hourly News Update

on:
  schedule:
    - cron: '51 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
    # 1. CHECKOUT SPECIFICALLY THE v1.1 BRANCH
    - name: Checkout v1.1 branch
      uses: actions/checkout@v3
      with:
        ref: v1.1

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Update Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python update_news.py

    - name: Commit and Push changes to v1.1
      run: |
        git config --global user.name "NewsBot"
        git config --global user.email "bot@ahora.nl"
        git add data/news.json
        # Check if there are changes; if yes, commit and push explicitly to v1.1
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 AI Update [v1.1]" && git push origin v1.1)